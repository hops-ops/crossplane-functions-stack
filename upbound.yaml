apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: crossplane-functions-stack
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.6.4'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1'
  description: Installs Crossplane Function packages plus their DeploymentRuntimeConfigs
    in the target Crossplane cluster.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # crossplane-functions-stack
    Installs Crossplane Function packages plus their DeploymentRuntimeConfigs in the target Crossplane cluster.
  repository: ghcr.io/hops-ops/crossplane-functions-stack
  source: github.com/hops-ops/crossplane-functions-stack
